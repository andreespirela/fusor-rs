[package]
name = "fusor-composition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fusor-core = { workspace = true, features = ["dom"] }
fusor-async = { workspace = true, features = ["browser"] }
wasm-bindgen.workspace = true

[build-dependencies]
fusor-build.workspace = true

[package.metadata.fusor]
entry = "web/index.html"
output = "dist"

[package.metadata.fusor.components]
layout = "web/layout.html"
card = "web/card.html"
