[package]
name = "catalog-designer-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
catalog-types = { path = "../types" }
catalog-designer-views = { path = "../designer-views" }
fusor-core = { workspace = true, features = ["islands"] }
fusor-islands = { workspace = true, features = ["browser"] }
fusor-async = { workspace = true, features = ["browser"] }
wasm-bindgen.workspace = true
[build-dependencies]
fusor-build.workspace = true
[package.metadata.fusor]
entry = "web/designer.html"
