<!doctype html><html><head><meta charset="utf-8"><title>Children</title></head><body>
<App state="{{ App::new(owner) }}"><main>
  <h1>Children</h1>
  <button id="toggle" on:click="state.visible.update(|v| *v = !*v)">Toggle panel</button>
  <button id="reset" on:click="state.version.update(|v| *v += 1)">Reset panel</button>
  <button id="reverse" on:click="state.rows.update(|v| v.reverse())">Reverse rows</button>
  <button id="placement" on:click="state.placed.update(|v| *v = !*v)">Toggle coherent placement</button>
  <output id="live">{{ state.live.get() }}</output>
  <Forward rust:if="state.visible.get()" rust:key="state.version.get()">
    Hello {{ state.count.get() }}!
    <button id="add" on:click="state.count.update(|n| *n += 1)">Add</button>
    <input id="draft" aria-label="Draft">
    <Tracked live="{{ state.live.clone() }}"></Tracked>
    <ul><ForEach items="{{ state.rows.get() }}" key="{{ |item| *item }}"><li>
      <Panel><span class="row">{{ index.get() }}:{{ item.get() }}</span></Panel>
    </li></ForEach></ul>
  </Forward>
  <CoherentForward placed="{{ state.placed.clone() }}" rust:if="state.visible.get()">
    <Match value="{{ Some(state.count.get()) }}"><Case pattern="Some(number)">
      <If condition="{{ state.visible.get() }}">
        <button id="coherent-add" on:click="state.count.update(|n| *n += 1)">{{ number.get() }}</button>
        <ul id="coherent-rows"><ForEach items="{{ state.rows.get() }}" key="{{ |item| *item }}"><li>
          <Panel><span class="coherent-row">{{ number.get() }}:{{ index.get() }}:{{ item.get() }}</span></Panel>
        </li></ForEach></ul>
      </If>
    </Case><Case pattern="None"></Case></Match>
  </CoherentForward>
  <Table><tr><td id="cell">{{ state.count.get() }}</td></tr></Table>
  <div id="empty"><Panel></Panel></div>
  <Ignore><Tracked live="{{ state.live.clone() }}"></Tracked></Ignore>
</main></App>
<template rust:component="Panel"><section class="panel"><Children></Children></section></template>
<template rust:component="Forward"><aside class="forward"><Panel><Children></Children></Panel></aside></template>
<template rust:component="CoherentForward"><Async><section id="coherent-forward"><Panel><If condition="{{ state.placed.get() }}"><Children></Children><Else><p class="unplaced">Children paused</p></Else></If></Panel></section></Async></template>
<template rust:component="Ignore"><p>Unused children do not start work.</p></template>
<template rust:component="Tracked"><button id="local" on:click="state.clicks.update(|n| *n += 1)">{{ state.clicks.get() }}</button></template>
</body></html>

<template rust:component="Table"><table><tbody><Children></Children></tbody></table></template>
