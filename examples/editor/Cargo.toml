[package]
name = "fusor-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
browser-tests = []

[dependencies]
fusor-components = { workspace = true, features = ["browser"] }
fusor-core = { workspace = true, features = ["dom"] }
fusor-std = { workspace = true, features = ["forms", "actions", "query", "resources", "routing", "browser"] }
# Generated outlets currently reference this direct crate path.
fusor-router = { workspace = true, features = ["browser"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["AbortSignal", "Request", "RequestInit", "Response", "Window", "Headers"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[build-dependencies]
fusor-build.workspace = true

[package.metadata.fusor]
entry = "web/index.html"
output = "dist"
base-path = "/editor/"
history-fallback = ["/project", "/away"]

[package.metadata.fusor.components]
views = "web/views.html"
