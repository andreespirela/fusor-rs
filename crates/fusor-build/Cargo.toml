[package]
name = "fusor-build"
description = "Build-script compiler that turns fusor HTML templates into Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["html", "wasm", "code-generation"]
categories = ["development-tools::build-utils"]

[dependencies]
html5gum = { version = "=0.8.4", default-features = false }
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
quote = { version = "=1.0.47", default-features = false }
syn = { version = "=2.0.119", default-features = false, features = ["parsing", "printing", "derive", "full"] }
fusor-core = { workspace = true }
fusor-islands = { workspace = true }
fusor-router = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.8.23"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.23.0"

[lints]
workspace = true
