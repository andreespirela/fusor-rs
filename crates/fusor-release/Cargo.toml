[package]
name = "fusor-release"
description = "Contributor tooling: packages and smoke-tests fusor CLI release archives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fusor-release"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "=4.5.53", features = ["derive"] }
serde_json = "1"
toml = "=0.8.23"
sha2 = "=0.10.9"
crc32fast = "=1.5.0"
flate2 = "=1.1.10"
tar = "=0.4.46"
ureq = { version = "=2.12.1", default-features = false }

[lints]
workspace = true
