<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typed context</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <App state="{{ App::new(owner)? }}">
    <main>
      <h1>A shared theme</h1>
      <button on:click='state.theme.set("light".into())'>Use light theme</button>
      <div><Badge></Badge></div>
    </main>
  </App>

  <template rust:component="Badge">
    <p data-theme="{{ state.theme.get() }}">Theme: {{ state.theme.get() }}</p>
  </template>
</body>
</html>
