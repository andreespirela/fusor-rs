<script type="text/rust" src="../src/pricing.rs"
        rust:module="crate::pricing"></script>

<template rust:component="Price">
  <Await value="{{ state.quote }}" let="result"><p class="price">Price: {{ result.as_str() }}</p></Await>
</template>

<template rust:component="Stock">
  <Await value="{{ state.stock }}" let="result"><p class="stock">Stock: {{ result.as_str() }}</p></Await>
</template>
