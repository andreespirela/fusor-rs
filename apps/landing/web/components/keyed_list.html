<template rust:component="KeyedList">
  <section class="keyed-demo" aria-label="Keyed list example">
    <div class="demo-actions">
      <button
        on:click="state.rows.update(|rows| rows.reverse())"
        disabled="{{ state.rows.get().len() &lt; 2 }}"
      >
        Reverse order
      </button>
      <button on:click="state.add()" disabled="{{ state.rows.get().len() >= 6 }}">Add row</button>
    </div>
    <ol class="keyed-rows">
      <ForEach items="{{ state.rows.get() }}" key="{{ |id| *id }}">
        <li data-row="{{ item.get() }}">
          <span class="row-id">#{{ item.get() }}</span>
          <input
            aria-label='{{ format!("Note for row {}", item.get()) }}'
            placeholder="Add a note…"
            maxlength="80"
          />
          <button
            aria-label='{{ format!("Remove row {}", item.get()) }}'
            on:click="state.remove(item.get())"
          >
            ×
          </button>
        </li>
      </ForEach>
    </ol>
    <p class="empty-result" hidden="{{ !state.rows.get().is_empty() }}">
      No rows. Add one to start again.
    </p>
    <p class="demo-instruction">Type a note, then reverse the list. The note stays with its row.</p>
  </section>
</template>
