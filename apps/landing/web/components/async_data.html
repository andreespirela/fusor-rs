<template rust:component="AsyncData">
  <section class="async-demo" aria-label="Async data example">
    <div class="demo-actions" role="group" aria-label="Issue">
      <button aria-pressed="{{ state.issue.get() == 12 }}" on:click="state.issue.set(12)">
        Issue #12
      </button>
      <button aria-pressed="{{ state.issue.get() == 34 }}" on:click="state.issue.set(34)">
        Issue #34
      </button>
    </div>
    <Async
      ><article class="issue-result" data-issue="{{ state.issue.get() }}">
        <h3>Issue #{{ state.issue.get() }}</h3>
        <IssueField
          issue="{{ state.issue.clone() }}"
          field='{{ "title" }}'
          delay="{{ 250 }}"
        ></IssueField>
        <IssueField
          issue="{{ state.issue.clone() }}"
          field='{{ "status" }}'
          delay="{{ 1000 }}"
        ></IssueField></article
    ></Async>
    <p class="fixture-note">Local sample data · 250 / 1,000 ms</p>
  </section>
</template>

<template rust:component="IssueField">
  <Await value="{{ state.value }}" let="value"
    ><p class="issue-field" data-field="{{ state.field }}">{{ value }}</p></Await
  >
</template>
