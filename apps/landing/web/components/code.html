<template rust:component="CodeBlock">
  <pre
    tabindex="0"
    aria-label='{{ format!("{} source", state.file.get().name) }}'
  ><code><ForEach items="{{ state.file.get().tokens.to_vec() }}" key="{{ |token| token.id }}"><span class="syntax-token" style="{{ item.get().style }}">{{ item.get().text }}</span></ForEach></code></pre>
</template>
